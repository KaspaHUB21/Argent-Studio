name: macOS compatibility tests
on:
  push:
    branches: [main, test/macos-compatibility, test/macos-diagnostics]
  workflow_dispatch:
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      CI: 'true'
      CARGO_HOME: ${{ github.workspace }}/.cargo
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.94.0'
      ARGENT_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install tools
        run: |
          npm install --global pnpm@11.19.0
          rustup toolchain install 1.94.0 --profile minimal
          uname -m
          xcodebuild -version
      - id: native_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cargo/registry
            .cargo/git
            .runtime-target
            src-tauri/target
          key: macos-v2-${{ matrix.arch }}-rust194-${{ hashFiles('src-tauri/Cargo.lock', 'resources/toolchains/argent-master/Cargo.lock') }}
          restore-keys: |
            macos-v2-${{ matrix.arch }}-rust194-
            macos-${{ matrix.arch }}-rust194-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install WebKit
        run: pnpm exec playwright install webkit
      - name: Build compiler and transaction runtime
        run: node scripts/build-runtime.mjs
      - name: Application and VM tests
        timeout-minutes: 5
        id: application
        continue-on-error: true
        run: pnpm test
      - name: Language service tests
        id: language
        continue-on-error: true
        run: pnpm run test:services
      - name: WebKit browser tests
        timeout-minutes: 10
        id: browser
        continue-on-error: true
        run: |
          pnpm exec playwright install webkit
          pnpm exec playwright test
      - name: Build frontend
        run: pnpm run build
      - name: Native Rust tests
        id: rust
        continue-on-error: true
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol
      - name: Build application bundle
        run: pnpm tauri build --bundles app --config .github/tauri.ci.json
      - name: Test native application bundle
        id: native
        continue-on-error: true
        run: node scripts/ci-macos-smoke.mjs
      - name: Package test application
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/Argent Studio.app' "test-output/Argent-Studio-$VERSION-macos-${{ matrix.arch }}-preview.zip"
          tar -czf "test-output/Argent-Studio-$VERSION-macos-${{ matrix.arch }}.app.tar.gz" -C src-tauri/target/release/bundle/macos 'Argent Studio.app'
      - name: Prepare isolated update test
        run: node scripts/prepare-macos-update-test.mjs
      - name: Build isolated updater application
        run: pnpm tauri build --bundles app --features ci-update-test --config test-output/updater/tauri.test.json
      - name: Verify native update and relaunch
        id: updater
        continue-on-error: true
        run: node scripts/test-macos-update.mjs
      - name: Preserve build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cargo/registry
            .cargo/git
            .runtime-target
            src-tauri/target
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macOS-${{ matrix.arch }}-evidence
          path: |
            test-output/**/*.json
            test-output/**/*.txt
            test-output/*.zip
            test-output/*.app.tar.gz
            test-results/
            qa/*.png
          retention-days: 14
      - name: Require all checks
        if: always()
        env:
          RESULTS: ${{ steps.application.outcome }} ${{ steps.language.outcome }} ${{ steps.browser.outcome }} ${{ steps.rust.outcome }} ${{ steps.native.outcome }} ${{ steps.updater.outcome }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
