name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CARGO_HOME: ${{ github.workspace }}/.cargo
      CARGO_BUILD_JOBS: '3'
      RUSTUP_TOOLCHAIN: '1.94.0'
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install build tools
        run: |
          npm install --global pnpm@11.19.0
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
          rustup toolchain install 1.94.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }

      - name: Cache dependencies and native builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cargo/registry
            .cargo/git
            .runtime-target
            src-tauri/target/release/build
            src-tauri/target/release/deps
            src-tauri/target/release/.fingerprint
          key: windows-2022-rust-1.94.0-node-24-v1-${{ hashFiles('pnpm-lock.yaml', '**/Cargo.lock', 'scripts/configure-build.mjs') }}
          restore-keys: |
            windows-2022-rust-1.94.0-node-24-v1-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --store-dir .pnpm-store

      - name: Build compiler and transaction runtime
        run: node scripts/build-runtime.mjs

      - name: Run application tests
        run: pnpm test

      - name: Run language service tests
        run: pnpm run test:services

      - name: Run browser tests
        run: pnpm exec playwright test

      - name: Build frontend for native tests
        run: pnpm run build

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis --config .github/tauri.ci.json

      - name: Test installed application
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          ./scripts/ci-windows-smoke.ps1 -Installer $installers[0].FullName

      - name: Prepare installer artifact
        run: |
          New-Item -ItemType Directory -Force test-output/installer | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          $name = "Argent-Studio-$version-windows-x64-ci-setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination "test-output/installer/$name"
          $hash = (Get-FileHash "test-output/installer/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content test-output/installer/SHA256SUMS.txt
          @("Commit: $env:GITHUB_SHA", "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", 'CI test build. No Windows publisher signature or updater signature. Not published to the update feed.') | Set-Content test-output/installer/BUILD.txt

      - name: Upload tested installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Argent-Studio-windows-x64-${{ github.run_number }}
          path: test-output/installer/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-test-reports-${{ github.run_number }}
          path: |
            test-output/ci-windows/**/*.json
            test-output/ci-windows/**/*.txt
            test-output/playwright.json
            test-results/
            qa/*.png
          if-no-files-found: warn
          retention-days: 14
