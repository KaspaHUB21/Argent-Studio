name: macOS focused diagnostics
on:
  push:
    branches: [test/macos-diagnostics]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
      ARGENT_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install tools
        run: |
          npm install --global pnpm@11.19.0
          rustup toolchain install 1.94.0 --profile minimal
          pnpm install --frozen-lockfile
          pnpm exec playwright install webkit
      - name: Structure editing with native paths
        timeout-minutes: 5
        id: structure
        continue-on-error: true
        run: node --test tests/structure-browser.test.mjs
      - name: Diagnose system path aliases
        id: paths
        continue-on-error: true
        run: |
          mkdir -p test-output/test-volume
          hdiutil create -size 64m -fs APFS -volname ArgentTestVolume test-output/test-volume.dmg
          hdiutil attach test-output/test-volume.dmg -mountpoint "$PWD/test-output/test-volume" -nobrowse
          trap 'hdiutil detach "$PWD/test-output/test-volume"' EXIT
          ARGENT_TEST_VOLUME="$PWD/test-output/test-volume" node scripts/probe-macos-paths.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: diagnostics-${{ matrix.runner }}
          path: |
            test-output/*.txt
            qa/*.png
          retention-days: 14
      - name: Require diagnostic checks
        if: always()
        run: test '${{ steps.structure.outcome }}' = success && test '${{ steps.paths.outcome }}' = success
