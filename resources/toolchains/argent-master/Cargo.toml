[workspace]
members = [".", "crates/argent-artifact", "crates/argent-runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "ISC"
authors = ["Argent-lang developers"]
repository = "https://github.com/argent-lang/argent"

[workspace.dependencies]
argent-artifact = { path = "crates/argent-artifact" }
argent-runtime = { path = "crates/argent-runtime" }
blake2b_simd = "1.0.2"
blake3 = "1.8.5"
colored = "2.2.0"
faster-hex = "0.10"
kaspa-consensus-core = "=2.1.0"
kaspa-txscript = "=2.1.0"
kaspa-txscript-errors = "=2.1.0"
secp256k1 = { version = "0.29.0", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
# SilverScript 1.0.1: immutable upstream source, Rusty Kaspa crates.io 2.1.0.
silverscript-abi = { git = "https://github.com/kaspanet/silverscript", rev = "a0dd7448ccc7bad5b99140f2c8edbbd0b2a874f1", package = "silverscript-abi" }
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", rev = "a0dd7448ccc7bad5b99140f2c8edbbd0b2a874f1", package = "silverscript-lang" }
thiserror = "2"

[package]
name = "argent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "argent"
path = "src/lib.rs"

[[bin]]
name = "argentc"
path = "src/main.rs"

[dependencies]
argent-artifact = { workspace = true }
argent-runtime = { workspace = true }
blake2b_simd = { workspace = true }
colored = { workspace = true }
kaspa-consensus-core = { workspace = true }
kaspa-txscript = { workspace = true }
serde_json = { workspace = true }
silverscript-abi = { workspace = true }
silverscript-lang = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
kaspa-txscript-errors = { workspace = true }
secp256k1 = { workspace = true }

# Published kaspa-hashes 2.1.0 omits the MSVC assembly file.
# This immutable crate copy restores only that upstream file; see its README.
[patch.crates-io]
kaspa-hashes = { path = '../kaspa-hashes-2.1.0' }
